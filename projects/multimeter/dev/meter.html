<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多用电表 · 3D 交互实验台</title>
<style>
:root{
  --ink:#2a241e; --muted:#7d7264; --line:#ded4c2; --paper:rgba(255,252,245,.9);
  --accent:#b0392c; --blue:#2b5f7e;
  --zh:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e3d7;font-family:var(--zh);color:var(--ink)}
#scene{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;left:26px;top:20px;pointer-events:none;z-index:5}
.hud h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.04em}
.hud p{margin:4px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.panel{position:fixed;top:78px;z-index:6;width:250px;padding:14px 14px 12px;border:1px solid var(--line);
  border-radius:16px;background:var(--paper);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(90,72,45,.10)}
.panel.left{left:22px}
.panel.right{right:22px;width:262px}
.panel h2{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
.panel section+section{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{flex:1 1 auto;min-width:52px;padding:7px 6px;border:1px solid var(--line);border-radius:9px;
  background:#fffdf8;color:#3b332b;font:500 12.5px/1 var(--zh);cursor:pointer;transition:background .16s,color .16s,border-color .16s}
.grid button:hover{border-color:#b8a88c}
.grid button:focus-visible,.tg:focus-visible,.act button:focus-visible,.tools button:focus-visible,.presets button:focus-visible{outline:3px solid #b0392c;outline-offset:2px}
.grid button.on{background:#2f2b26;border-color:#2f2b26;color:#f8f3e6}
.grid button.ohm.on{background:#7a2f24;border-color:#7a2f24}
.toggles{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--line);
  border-radius:9px;background:#fffdf8;font-size:12.5px;cursor:pointer}
.tg i{width:30px;height:16px;border-radius:9px;background:#d8cfbd;position:relative;transition:background .18s}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .18s}
.tg.on i{background:#5d8a63}
.tg.on i::after{left:16px}
.ro{display:flex;flex-direction:column;gap:7px}
.ro .line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ro .line b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ro .big{margin-top:4px;padding:10px 12px;border-radius:11px;background:#2f2b26;color:#f7efdd;display:flex;align-items:baseline;gap:6px}
.ro .big span{font:600 26px/1 var(--zh);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ro .big em{font-style:normal;font-size:12px;opacity:.72}
.status{margin-top:10px;padding:8px 10px;border-radius:9px;font-size:12px;line-height:1.5;
  background:#eef3e9;color:#3f5c34;border:1px solid #d5e0cb}
.status.warn{background:#fbf0dc;color:#8a5b12;border-color:#eedcb5}
.status.bad{background:#fbe9e6;color:#a03225;border-color:#f0cfc9}
.act{margin-top:10px;display:flex;gap:6px}
.act button{flex:1;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:#fffdf8;
  font:500 12.5px/1 var(--zh);color:#3b332b;cursor:pointer}
.act button:hover{border-color:#b8a88c}
.tools{position:fixed;right:22px;top:20px;z-index:6;display:flex;gap:8px}
.tools button{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  backdrop-filter:blur(8px);font:500 12px/1 var(--zh);color:#4a423a;cursor:pointer}
.tools button:hover{border-color:#b8a88c}
.panel.cam{right:22px;top:auto;bottom:22px;width:262px;padding:12px 14px 12px}
.camrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:9px}
.camrow span{width:24px;flex:none;letter-spacing:.04em}
.camrow input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:#ded4c2;outline:none;cursor:pointer}
.camrow input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#b0392c;border:2px solid #fffdf8;box-shadow:0 1px 3px rgba(90,72,45,.35);cursor:pointer}
.camrow input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#b0392c;
  border:2px solid #fffdf8;cursor:pointer}
.camrow b{width:40px;text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{flex:1 1 28%;padding:6px 4px;border:1px solid var(--line);border-radius:8px;
  background:#fffdf8;font:500 11.5px/1 var(--zh);color:#3b332b;cursor:pointer;transition:.15s}
.presets button:hover{border-color:#b8a88c}
.presets button.on{background:#2f2b26;border-color:#2f2b26;color:#f8f3e6}
.quiz{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:8;width:min(660px,calc(100vw - 470px));min-width:320px;padding:10px 14px 11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,252,245,.95);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(90,72,45,.12);display:none}
body.quiz-on .quiz{display:block}
body.quiz-on .lesson{display:none}
.quiz-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.quiz-top b{font-size:12px;flex:none}
.quiz-q{flex:1;min-width:0;font-size:11.5px;line-height:1.4;color:var(--ink)}
.quiz-nav{display:flex;gap:5px;flex:none}
.quiz-nav button{border:1px solid var(--line);border-radius:8px;background:#fffdf8;color:var(--ink);padding:6px 8px;font:500 11px var(--zh);cursor:pointer}
.quiz-nav .quiz-next{background:#2f2b26;color:#fff;border-color:#2f2b26}
.quiz-ans{display:flex;align-items:center;gap:7px}
.quiz-ans label{font-size:11.5px;color:var(--muted);flex:none}
.quiz-ans input{flex:0 1 150px;min-width:70px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:600 13px var(--zh);color:var(--ink);outline:none}
.quiz-ans input:focus{border-color:#b0392c}
.quiz-ans em{font-style:normal;font-size:12px;color:var(--muted);width:24px;flex:none}
.quiz-ans .quiz-submit{border:0;border-radius:8px;background:#b0392c;color:#fff;padding:8px 12px;font:600 11.5px var(--zh);cursor:pointer;white-space:nowrap}
.quiz-res{flex:1;min-width:0;font-size:11.5px;line-height:1.45}
.quiz-res.ok{color:#3f5c34}
.quiz-res.bad{color:#a03225}
.quiz-hist{display:flex;gap:3px;margin-left:auto;flex:none;align-items:center}
.quiz-hist b{font-size:11px;color:var(--muted);font-weight:500;margin-right:2px}
.quiz-hist i{font-style:normal;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;background:#e7e0d2;color:var(--muted)}
.quiz-hist i.ok{background:#d9e5cf;color:#3f5c34}
.quiz-hist i.bad{background:#f3d2cc;color:#a03225}
.hint{position:fixed;left:26px;bottom:18px;z-index:5;font-size:12px;color:#8b8071;letter-spacing:.02em;pointer-events:none}
.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,14px);z-index:20;max-width:70vw;
  padding:10px 18px;border-radius:11px;background:rgba(42,36,30,.92);color:#fdf6e7;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lesson{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;width:min(430px,calc(100vw - 560px));min-width:270px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,252,245,.94);box-shadow:0 8px 24px rgba(90,72,45,.1);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px}
.lesson-copy{flex:1;min-width:0}.lesson-copy b{display:block;font-size:12px;margin-bottom:3px}.lesson-copy span{display:block;font-size:11px;line-height:1.45;color:var(--muted)}
.lesson-nav{display:flex;gap:5px;flex:none}.lesson-nav button{border:1px solid var(--line);border-radius:8px;background:#fffdf8;color:var(--ink);padding:7px 9px;font:500 11px var(--zh);cursor:pointer}.lesson-nav button:disabled{opacity:.4;cursor:default}.lesson-nav .lesson-next{background:#2f2b26;color:#fff;border-color:#2f2b26}
.panel.left.collapsed{width:44px;padding:8px}.panel.left.collapsed>section,.panel.left.collapsed .panel-title span{display:none}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel-title h2{margin:0}.panel-title button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;font:600 15px var(--zh)}
.tg{user-select:none}.tg:active,.grid button:active,.act button:active,.tools button:active{transform:translateY(1px)}
@media (max-width:1180px){
  .panel{width:212px;padding:12px}
  .panel.right{width:224px}
  .hud p{display:none}
}
@media (max-width:900px){
  .hud{left:12px;top:10px}.hud h1{font-size:14px}.tools{right:10px;top:8px;gap:5px}.tools button{padding:7px 9px}
  .panel.left{display:block;top:52px;left:10px;width:min(205px,56vw);max-height:calc(100dvh - 70px);overflow:auto;padding:10px;background:rgba(255,252,245,.94)}
  .panel.left section+section{margin-top:9px;padding-top:8px}.panel.left .grid{gap:4px}.panel.left .grid button{min-width:44px;padding:7px 4px;font-size:11px}.panel.left .tg{font-size:11px;padding:6px 7px}
  .panel.left.collapsed{width:42px;padding:8px}.panel.left.collapsed .panel-title{margin:0;justify-content:center}
  .panel.right{width:min(210px,54vw);top:auto;bottom:10px;right:10px;padding:10px;background:rgba(255,252,245,.95)}.panel.right .ro{gap:4px}.panel.right .line{font-size:10px}.panel.right .big{padding:8px 10px}.panel.right .big span{font-size:22px}.panel.right .status{font-size:10px;margin-top:6px;padding:6px 8px}.panel.right .act{margin-top:6px}.panel.right .act button{padding:7px 4px;font-size:10px}
  .panel.cam{display:none}.lesson{left:10px;bottom:10px;transform:none;width:calc(100vw - 240px);min-width:0;padding:8px 10px;gap:6px}.lesson-copy span{font-size:10px}.lesson-copy b{font-size:11px}.lesson-nav button{padding:6px 7px;font-size:10px}.hint{display:none}
  .quiz{top:46px;left:10px;transform:none;width:calc(100vw - 20px);min-width:0;padding:8px 10px}.quiz-ans{flex-wrap:wrap}.quiz-ans input{flex:1 1 90px}.quiz-hist{margin-left:0}
}
@media (max-width:560px){.lesson{bottom:calc(210px + env(safe-area-inset-bottom));left:10px;width:calc(100vw - 20px)}.quiz{top:auto;bottom:calc(205px + env(safe-area-inset-bottom));left:10px;transform:none;width:calc(100vw - 20px)}.quiz-ans{flex-wrap:wrap}.quiz-ans input{flex:1 1 90px}.quiz-hist{margin-left:0}.panel.right{bottom:10px;right:10px;width:calc(100vw - 20px);max-height:195px;overflow:auto}.panel.left{width:min(190px,53vw);max-height:42vh;bottom:auto}.panel.left:not(.collapsed){max-height:42vh}.hud p{display:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <h1>多用电表 · 3D 交互实验台</h1>
  <p>MF-47 型指针式 ｜ 拖动旋转视角，滚轮缩放，点击旋钮换挡</p>
</div>

<div class="tools">
  <button id="btnQuiz">练习模式</button>
  <button id="btnReset">复位视角</button>
  <button id="btnFull">全屏</button>
</div>

<aside class="panel left">
  <div class="panel-title"><h2>实验控制</h2><button id="btnPanel" type="button" aria-label="收起实验控制" title="收起/展开">−</button></div>
  <section>
    <h2>量程 · 电压</h2>
    <div class="grid" id="gV"></div>
  </section>
  <section>
    <h2>量程 · 电流</h2>
    <div class="grid" id="gA"></div>
  </section>
  <section>
    <h2>量程 · 电阻</h2>
    <div class="grid" id="gR"></div>
  </section>
  <section>
    <h2>被测对象</h2>
    <div class="grid" id="gT"></div>
  </section>
  <section>
    <h2>表笔状态</h2>
    <div class="toggles">
      <div class="tg on" id="tgRed"><span>红表笔已插入 ＋</span><i></i></div>
      <div class="tg on" id="tgBlack"><span>黑表笔已插入 COM</span><i></i></div>
      <div class="tg" id="tgShort"><span>两支表笔短接</span><i></i></div>
    </div>
  </section>
</aside>

<aside class="panel right">
  <h2>读数</h2>
  <div class="ro">
    <div class="line"><span>挡位</span><b id="roRange">—</b></div>
    <div class="line"><span>指针所指刻度</span><b id="roScale">—</b></div>
    <div class="line"><span>换算</span><b id="roCalc">—</b></div>
    <div class="big"><span id="roValue">—</span><em id="roUnit"></em></div>
  </div>
  <div class="status" id="roStatus">请选择量程</div>
  <div class="act">
    <button id="btnOhm">欧姆调零</button>
    <button id="btnMech">机械调零</button>
  </div>
</aside>

<aside class="panel cam" id="camPanel">
  <h2>视角调节</h2>
  <div class="camrow"><span>水平</span><input id="sTheta" type="range" min="-55" max="55" step="1" value="0"><b id="vTheta">0°</b></div>
  <div class="camrow"><span>俯仰</span><input id="sPhi" type="range" min="-4" max="55" step="1" value="23"><b id="vPhi">23°</b></div>
  <div class="camrow"><span>距离</span><input id="sR" type="range" min="5" max="26" step="0.1" value="11.6"><b id="vR">11.6</b></div>
  <div class="camrow"><span>左右</span><input id="sPanX" type="range" min="-6" max="6" step="0.1" value="0"><b id="vPanX">0.0</b></div>
  <div class="camrow"><span>高低</span><input id="sPanY" type="range" min="-3" max="4" step="0.1" value="-0.2"><b id="vPanY">-0.2</b></div>
  <div class="presets">
    <button data-p="front">正视</button>
    <button data-p="top">俯视</button>
    <button data-p="left">左前</button>
    <button data-p="right">右前</button>
    <button data-p="dial">看表盘</button>
  </div>
</aside>

<div class="hint">拖动＝旋转 ｜ Shift+拖动 或 右键拖动＝平移机位 ｜ 滚轮＝缩放 ｜ 右下角可精确调节</div>
<div class="lesson" aria-live="polite"><div class="lesson-copy"><b id="lessonTitle">实验步骤 1 / 4</b><span id="lessonText"></span></div><div class="lesson-nav"><button id="lessonPrev" type="button">上一步</button><button id="lessonNext" class="lesson-next" type="button">下一步</button></div></div>
<div class="quiz" id="quizBar" aria-live="polite">
  <div class="quiz-top"><b id="quizNo">练习 第 1 题</b><span class="quiz-q" id="quizQ"></span>
    <span class="quiz-nav"><button id="quizSkip" type="button">跳过</button><button id="quizGo" class="quiz-next" type="button">下一题</button></span>
  </div>
  <div class="quiz-ans">
    <label for="quizInput">你的读数</label>
    <input id="quizInput" type="text" inputmode="decimal" placeholder="如 1.50 / 47000 / 47k" autocomplete="off">
    <em id="quizUnit">V</em>
    <button id="quizSubmit" class="quiz-submit" type="button">提交判分</button>
    <span class="quiz-res" id="quizRes">提交后在这里看逐项判分</span>
    <span class="quiz-hist" id="quizHist"><b>记录</b></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../vendor/three.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const D2R = Math.PI/180, R2D = 180/Math.PI;

/* ---------- 量程与被测对象定义 ---------- */
const RANGES = [
  {label:'2.5V',  kind:'V', max:2.5, smax:250, div:100},
  {label:'10V',   kind:'V', max:10,  smax:50,  div:5},
  {label:'50V',   kind:'V', max:50,  smax:50,  div:1},
  {label:'250V',  kind:'V', max:250, smax:250, div:1},
  {label:'500V',  kind:'V', max:500, smax:250, div:2},
  {label:'5mA',   kind:'A', max:5,   smax:50,  div:10},
  {label:'50mA',  kind:'A', max:50,  smax:50,  div:1},
  {label:'500mA', kind:'A', max:500, smax:50,  div:10},
  {label:'×1',    kind:'R', mult:1},
  {label:'×10',   kind:'R', mult:10},
  {label:'×100',  kind:'R', mult:100},
  {label:'×1k',   kind:'R', mult:1000}
];
const TARGETS = {
  batt:  {name:'干电池 1.5V', kind:'dc', v:1.5, sub:'1.5 V'},
  res:   {name:'电阻 1.2kΩ', kind:'R', r:1200, sub:'1.2 kΩ'},
  diodeF:{name:'二极管 正接', kind:'diode', r:420, sub:'正向导通'},
  diodeR:{name:'二极管 反接', kind:'diode', r:900000, sub:'反向截止'},
  ac:    {name:'交流 220V', kind:'ac', v:220, sub:'~ 220 V'},
  open:  {name:'断路导线', kind:'open', sub:'断开'}
};

const state = {
  range: 0,            // 默认 2.5V
  target: 'batt',
  plugged: {red:true, black:true},
  shorted: false,
  ohmZero: false,      // 当前电阻挡是否已调零
  mechOffset: 2.6      // 机械零位偏差（度，正=偏左）
};

/* ---------- 面板贴图 ---------- */
const PW = 1024, PH = 1340;
const PANEL_W = 2.46, PANEL_H = 3.22;
const S = PW / PANEL_W;               // 416 px / 单位
const PX = x => (x + PANEL_W/2) * S;
const PY = y => (PANEL_H/2 - y) * S;

const DIAL = {cx:0, cy:0.50, R:0.92};
const CX = PX(DIAL.cx), CY = PY(DIAL.cy), RAD = DIAL.R * S;
const A0 = 55, SWEEP = 110;
const angOf = f => A0 - SWEEP * f;
function polar(cx, cy, r, deg){
  const t = deg * D2R;
  return [cx - r*Math.sin(t), cy - r*Math.cos(t)];
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y); g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+r, y+h); g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y); g.closePath();
}
function tick(g, ang, rOut, len, w, color){
  const [x1,y1] = polar(CX, CY, rOut, ang);
  const [x2,y2] = polar(CX, CY, rOut-len, ang);
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2);
  g.lineWidth = w; g.strokeStyle = color; g.stroke();
}
function scaleText(g, ang, r, txt, size, color){
  const [x,y] = polar(CX, CY, r, ang);
  g.save(); g.translate(x,y); g.rotate(-ang*D2R);
  g.fillStyle = color; g.font = '500 '+size+'px "Microsoft YaHei",sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(txt, 0, 0); g.restore();
}

function drawPanel(){
  const cv = document.createElement('canvas');
  cv.width = PW; cv.height = PH;
  const g = cv.getContext('2d');

  // 机壳
  const shell = g.createLinearGradient(0,0,PW,PH);
  shell.addColorStop(0,'#3b352e'); shell.addColorStop(.5,'#2d2822'); shell.addColorStop(1,'#37312a');
  g.fillStyle = shell; g.fillRect(0,0,PW,PH);

  // 面板
  roundRect(g, 22, 22, PW-44, PH-44, 20);
  const face = g.createLinearGradient(0,22,0,PH-22);
  face.addColorStop(0,'#f3ebd9'); face.addColorStop(1,'#e6dcc6');
  g.fillStyle = face; g.fill();
  g.strokeStyle = '#c6b99e'; g.lineWidth = 3; g.stroke();

  // 品牌
  g.fillStyle = '#4b4237'; g.textAlign='center'; g.textBaseline='middle';
  g.font = '600 27px "Microsoft YaHei",sans-serif';
  g.fillText('MF-47', PX(0), PY(1.50));
  g.font = '400 18px "Microsoft YaHei",sans-serif';
  g.fillStyle = '#6b5f4e';
  g.fillText('指针式多用电表', PX(0), PY(1.36));

  // 表盘
  g.save();
  g.beginPath(); g.arc(CX, CY, RAD+26, 0, Math.PI*2);
  g.fillStyle = '#fdfaf1'; g.fill();
  g.lineWidth = 5; g.strokeStyle = '#26221c'; g.stroke();
  g.beginPath(); g.arc(CX, CY, RAD+8, 0, Math.PI*2);
  g.lineWidth = 1.5; g.strokeStyle = '#b9ae95'; g.stroke();

  // 反光镜弧带
  g.beginPath();
  g.arc(CX, CY, RAD-8, (-A0-4)*D2R, (A0+4)*D2R, false);
  g.arc(CX, CY, RAD-40, (A0+4)*D2R, (-A0-4)*D2R, true);
  g.closePath(); g.fillStyle = 'rgba(150,160,150,.22)'; g.fill();

  // 电阻挡刻度（最外）
  const ohmTicks = [0,1,2,3,5,7,10,15,20,30,50,100,200,500,Infinity];
  const ohmLabels = new Set([0,1,5,10,15,20,30,50,100,Infinity]);
  ohmTicks.forEach(v=>{
    const f = v===Infinity ? 0 : 15/(15+v);
    const ang = angOf(f);
    const major = ohmLabels.has(v);
    tick(g, ang, RAD-14, major?20:10, major?3.2:1.6, '#26221c');
    if(major){
      const txt = v===Infinity ? '∞' : String(v);
      scaleText(g, ang, RAD-50, txt, 20, '#26221c');
    }
  });
  scaleText(g, angOf(0)+3.2, RAD-96, 'Ω', 36, '#8a2f22');

  // 0—250 刻度
  for(let v=0; v<=250; v+=10){
    const ang = angOf(v/250);
    const major = v % 50 === 0;
    tick(g, ang, RAD-72, major?22:11, major?3:1.5, '#26221c');
    if(major) scaleText(g, ang, RAD-104, String(v), 25, '#26221c');
  }
  // 0—50 刻度
  for(let v=0; v<=50; v+=1){
    const ang = angOf(v/50);
    const major = v % 5 === 0;
    tick(g, ang, RAD-136, major?20:9, major?2.6:1.3, '#26221c');
    if(major) scaleText(g, ang, RAD-166, String(v), 25, '#26221c');
  }

  // 表盘文字
  g.fillStyle = '#8a7f6b'; g.font = '400 17px "Microsoft YaHei",sans-serif';
  g.textAlign='center';
  g.fillText('DC  V·mA', CX, CY - RAD*0.30);
  g.fillText('Ω', CX, CY - RAD*0.16);

  // 机械调零螺钉
  const mx = PX(1.12), my = PY(1.10);
  g.beginPath(); g.arc(mx, my, 26, 0, Math.PI*2);
  g.fillStyle = '#2b2621'; g.fill();
  g.strokeStyle = '#8b8172'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(mx-13, my-9); g.lineTo(mx+13, my+9); g.stroke();
  g.fillStyle = '#6b5f4e'; g.font = '400 15px "Microsoft YaHei",sans-serif';
  g.textAlign='left';
  g.fillText('机械调零', mx-96, my+5);

  // 量程旋钮底座
  const kx = PX(-0.52), ky = PY(-0.98);
  g.beginPath(); g.arc(kx, ky, 0.40*S+10, 0, Math.PI*2);
  g.fillStyle = '#cfc3aa'; g.fill();
  g.beginPath(); g.arc(kx, ky, 0.40*S, 0, Math.PI*2);
  g.fillStyle = '#2b2724'; g.fill();

  // 旋钮 12 个挡位标记
  const N = RANGES.length, step = 300/(N-1);
  RANGES.forEach((r,i)=>{
    const deg = -150 + i*step;
    const t = deg*D2R;
    const x1 = kx - 0.44*S*Math.sin(t), y1 = ky - 0.44*S*Math.cos(t);
    const x2 = kx - 0.51*S*Math.sin(t), y2 = ky - 0.51*S*Math.cos(t);
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineWidth = 3; g.strokeStyle='#8d8069'; g.stroke();
    const lx = kx - 0.63*S*Math.sin(t), ly = ky - 0.63*S*Math.cos(t);
    g.save(); g.translate(lx,ly);
    g.fillStyle = r.kind==='R' ? '#7a2f24' : '#3a332b';
    g.font = '600 24px "Microsoft YaHei",sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(r.label, 0, 0); g.restore();
  });

  // 欧姆调零旋钮
  const ox = PX(0.52), oy = PY(-0.72);
  g.beginPath(); g.arc(ox, oy, 0.20*S, 0, Math.PI*2);
  g.fillStyle = '#cfc3aa'; g.fill();
  g.beginPath(); g.arc(ox, oy, 0.18*S, 0, Math.PI*2);
  g.fillStyle = '#2b2724'; g.fill();
  g.beginPath(); g.arc(ox, oy, 0.18*S*0.42, 0, Math.PI*2);
  g.fillStyle = '#4a433a'; g.fill();
  g.fillStyle = '#7a2f24'; g.font='600 17px "Microsoft YaHei",sans-serif'; g.textAlign='center';
  g.fillText('Ω 调零', ox, oy + 0.30*S);

  // 表笔插孔
  function jack(x, color, label){
    const jx = PX(x), jy = PY(-1.30);
    g.beginPath(); g.arc(jx, jy, 40, 0, Math.PI*2);
    g.fillStyle = '#d9cdb4'; g.fill();
    g.beginPath(); g.arc(jx, jy, 33, 0, Math.PI*2);
    g.fillStyle = color; g.fill();
    g.beginPath(); g.arc(jx, jy, 17, 0, Math.PI*2);
    g.fillStyle = '#17140f'; g.fill();
    g.fillStyle = color; g.font='700 22px "Microsoft YaHei",sans-serif'; g.textAlign='center';
    g.fillText(label, jx, jy + 58);
  }
  jack(0.90, '#a8321f', '＋');
  jack(0.52, '#2b2b2b', 'COM');

  return cv;
}

function roundedBox(w, h, d, r){
  const sh = new THREE.Shape();
  const x = -w/2 + r, y = -h/2 + r, W = w - 2*r, H = h - 2*r;
  sh.moveTo(x, -h/2);
  sh.lineTo(x + W, -h/2);
  sh.quadraticCurveTo(w/2, -h/2, w/2, y);
  sh.lineTo(w/2, y + H);
  sh.quadraticCurveTo(w/2, h/2, x + W, h/2);
  sh.lineTo(x, h/2);
  sh.quadraticCurveTo(-w/2, h/2, -w/2, y + H);
  sh.lineTo(-w/2, y);
  sh.quadraticCurveTo(-w/2, -h/2, x, -h/2);
  const b = 0.035;
  const geo = new THREE.ExtrudeGeometry(sh, {depth: d - 2*b, bevelEnabled:true,
    bevelThickness:b, bevelSize:b, bevelSegments:4, curveSegments:18});
  geo.translate(0, 0, -(d/2 - b));
  return geo;
}

  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.017, 0.15, 12),
    new THREE.MeshStandardMaterial({color:0xb9b2a4, roughness:0.3, metalness:0.85}));
  tip.position.y = 0.075; tip.rotation.x = Math.PI; grp.add(tip);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.13, 10),
    new THREE.MeshStandardMaterial({color:0xc9c2b4, roughness:0.3, metalness:0.8}));
  shaft.position.y = 0.215; grp.add(shaft);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.032, 0.32, 18), mat);
  handle.position.y = 0.44; handle.castShadow = true; grp.add(handle);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.012, 18), mat);
  ring.position.y = 0.60; grp.add(ring);

  grp.position.copy(tipPos);
  const dir = backPos.clone().sub(tipPos).normalize();
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  scene.add(grp);
  return grp;
}
function makeWire(color, pts){
  const curve = new THREE.CatmullRomCurve3(pts.map(p=>p.clone()));
  const geo = new THREE.TubeGeometry(curve, 64, 0.019, 10, false);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:0.65, metalness:0.05}));
  mesh.castShadow = true;
  [pts[0], pts[pts.length-1]].forEach(p=>{
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.019, 10, 8), mesh.material);
    cap.position.copy(p);
    cap.castShadow = true;
    mesh.add(cap);
  });
  scene.add(mesh);
  return mesh;
}

/* ---------- 指针与读数 ---------- */
let needleDeg = 55;      // 当前指针角度（度，正=偏左）
let needleVel = 0;
let targetDeg = 55;
let liveF = 0;           // 由真实指针位置反算的偏转比例

function computeTarget(){
  const r = RANGES[state.range];
  const t = TARGETS[state.target];
  let f = 0, warn = null, hint = '';

  if(!state.plugged.red || !state.plugged.black){
    return {f:0, warn:'表笔未插好，回路没有接通', hint:'把红、黑表笔插进 ＋ 与 COM 插孔'};
  }
  if(state.shorted){
    f = (r.kind === 'R') ? 1 : 0;
    hint = (r.kind === 'R') ? '表笔短接：指针满偏到 0 Ω 端' : '表笔短接：没有电压电流，指针不动';
    return {f, warn:null, hint};
  }

  if(r.kind === 'V'){
    if(t.kind === 'dc'){
      f = t.v / r.max;
      if(f > 1.02){ warn = '超量程：指针打到满偏，换更大的电压挡'; f = 1.06; }
    } else if(t.kind === 'ac'){
      f = 0; hint = '直流电压挡测交流：指针基本不动，读数约为 0';
    } else if(t.kind === 'open'){
      hint = '断路，没有电压';
    } else {
      hint = '测电阻要用电阻挡，电压挡读数为 0';
    }
  } else if(r.kind === 'A'){
    if(t.kind === 'dc'){
      f = 1.06; warn = '危险：电流挡直接接电源，表头严重过载（实物会烧保险丝）';
    } else if(t.kind === 'ac'){
      f = 0; hint = '直流电流挡测交流，指针不动';
    } else {
      hint = '电流挡应串联在电路中，此处读数为 0';
    }
  } else {
    if(t.kind === 'R' || t.kind === 'diode'){
      const Ri = 15 * r.mult;
      f = Ri / (Ri + t.r);
      if(!state.ohmZero) f = f * 0.86 + 0.05;
    } else if(t.kind === 'open'){
      f = state.ohmZero ? 0 : 0.05;
      hint = '断路：指针停在 ∞ 端不动';
    } else if(t.kind === 'dc' || t.kind === 'ac'){
      f = 1.06; warn = '禁止带电测电阻：指针满偏，还可能损坏表头';
    }
  }
  return {f: Math.max(0, Math.min(1.06, f)), warn, hint};
}

function updateNeedle(dt){
  targetDeg = angOf(Math.min(1.06, Math.max(-0.02, computeTarget().f))) + state.mechOffset;
  const k = 95, c = 8.4;
  for(let i=0;i<3;i++){
    const h = dt/3;
    const acc = k*(targetDeg - needleDeg) - c*needleVel;
    needleVel += acc*h;
    needleDeg += needleVel*h;
  }
  needleGroup.rotation.z = needleDeg * D2R;
  liveF = (A0 - needleDeg) / SWEEP;
}

function fmt(v, d){
  if(!isFinite(v)) return '∞';
  return v.toFixed(d);
}

let lastRO = '';
function updateReadout(){
  const r = RANGES[state.range];
  const res = computeTarget();
  const f = Math.max(0, Math.min(1, liveF));
  $('roRange').textContent = (r.kind==='V'?'直流电压 ':r.kind==='A'?'直流电流 ':'电阻 ') + r.label;

  let scaleTxt, calcTxt, valueTxt, unitTxt;
  if(r.kind === 'R'){
    const s = f < 0.006 ? Infinity : 15*(1-f)/f;
    scaleTxt = (s===Infinity ? '∞' : fmt(s,1)) + ' Ω（0–15 中心刻度）';
    if(s === Infinity){ valueTxt = '∞'; unitTxt = 'Ω'; calcTxt = '指针在 ∞ 端'; }
    else { valueTxt = fmt(s*r.mult, s*r.mult>=100?0:1); unitTxt = 'Ω'; calcTxt = fmt(s,1)+' × '+r.mult; }
  } else {
    const s = f * r.smax;
    scaleTxt = fmt(s,1) + '（0–' + r.smax + ' 线）';
    valueTxt = fmt(f * r.max, r.max<=10?2:1);
    unitTxt = r.kind==='V' ? 'V' : 'mA';
    calcTxt = fmt(s,1) + ' × ' + r.div;
  }
  $('roScale').textContent = scaleTxt;
  $('roCalc').textContent = calcTxt;
  $('roValue').textContent = valueTxt;
  $('roUnit').textContent = unitTxt;

  const st = $('roStatus');
  let cls = '', txt = '';
  if(res.warn){ cls = 'bad'; txt = res.warn; }
  else if(r.kind === 'R' && !state.ohmZero){ cls = 'warn'; txt = '欧姆挡未调零：先把表笔短接，再调 Ω 调零旋钮'; }
  else if(Math.abs(state.mechOffset) > 0.3){ cls = 'warn'; txt = '机械零位没对准，读数有系统偏差（点“机械调零”）'; }
  else if(res.hint){ cls = ''; txt = res.hint; }
  else { txt = '读数正常：' + (r.kind==='R' ? '欧姆刻度从右往左读，右端为 0 Ω' : '线性刻度从左往右读'); }

  const key = cls + txt;
  if(key !== lastRO){
    lastRO = key;
    st.className = 'status ' + cls;
    st.textContent = txt;
  }
}

function setRange(i, silent){
  const prev = RANGES[state.range];

  syncUI();

}

let dragging = false, panning = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', e=>{
  dragging = true;
  panning = (e.button === 2 || e.button === 1 || e.shiftKey);
  lastX = downX = e.clientX; lastY = downY = e.clientY;
  camTween = null;
  document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('on'));
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if(panning){ panView(dx, dy); return; }
  VIEW.theta -= dx * 0.005;
  VIEW.phi = Math.min(1.62, Math.max(0.55, VIEW.phi - dy * 0.004));
  VIEW.theta = Math.min(1, Math.max(-1, VIEW.theta));
  placeCamera(); syncCam();
});
canvas.addEventListener('pointerup', e=>{
  const wasPanning = panning;
  const wasDragging = dragging;
  dragging = false; panning = false;
  if(wasDragging && !wasPanning && Math.hypot(e.clientX-downX, e.clientY-downY) < 7) pick(e);
});
canvas.addEventListener('pointercancel',()=>{dragging=false;panning=false});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camTween = null;
  VIEW.r = Math.min(26, Math.max(5.0, VIEW.r + e.deltaY * 0.0055));
  placeCamera(); syncCam();
}, {passive:false});

// 拾取
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
function pick(e){
  const rect = canvas.getBoundingClientRect();
  ptr.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  ptr.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([knobBody, knobRing, ohmBody, mechScrew, jackRed, jackBlack, card], true);
  if(!hits.length) return;
  let o = hits[0].object;
  while(o.parent && o.parent !== scene) o = o.parent;
  const name = o === knobGroup ? 'knob' : o === ohmKnob ? 'ohm' : o === jackRed ? 'red'
             : o === jackBlack ? 'black' : o === card ? 'card' : o === mechScrew ? 'mech' : '';
  if(name === 'knob'){
    const next = e.shiftKey ? (state.range + RANGES.length - 1) % RANGES.length : (state.range + 1) % RANGES.length;
    setRange(next);
    toast('旋钮转到 ' + RANGES[next].label + ' 挡');
  } else if(name === 'ohm'){
    $('btnOhm').click();
  } else if(name === 'mech'){
    $('btnMech').click();
  } else if(name === 'red'){
    $('tgRed').click();
  } else if(name === 'black'){
    $('tgBlack').click();
  } else if(name === 'card'){
    const keys = Object.keys(TARGETS);
    setTarget(keys[(keys.indexOf(state.target)+1) % keys.length]);
    toast('换成：' + TARGETS[state.target].name);
  }
}

/* ---------- 练习判分 ---------- */
const QUIZ_POOL = ['batt', 'res', 'diodeF'];
const RES_POOL = [120, 470, 1200, 4700, 15000, 47000];
const quiz = {n:0, hist:[], cur:null};
function fmtRes(r){ return r >= 1000 ? (r/1000) + ' kΩ' : r + ' Ω'; }
function quizValue(t){
  if(t === 'batt') return {v:1.5, unit:'V', tol:0.08, ask:'测量干电池电压，读出电压值'};
  if(t === 'diodeF') return {v:420, unit:'Ω', tol:130, ask:'正向测量二极管，读出它的正向电阻'};
  const r = RES_POOL[Math.floor(Math.random()*RES_POOL.length)];
  return {v:r, unit:'Ω', tol:r*0.06 + 3, ask:'用电阻挡测量一只定值电阻，读出阻值', res:r};
}
function setQuizRes(res){
  const el = $('quizRes');
  el.className = 'quiz-res' + (res ? (res.pass ? ' ok' : ' bad') : '');
  el.textContent = res ? res.text : '提交后在这里看逐项判分';
}
function newQuestion(){
  let t;
  do { t = QUIZ_POOL[Math.floor(Math.random()*QUIZ_POOL.length)]; } while(quiz.cur && t === quiz.cur.type);
  const q = quizValue(t);
  q.type = t;
  if(q.res !== undefined){
    TARGETS.res.r = q.res; TARGETS.res.sub = fmtRes(q.res);
    const b = document.querySelector('#gT button[data-k="res"]');
    if(b) b.textContent = '电阻 ' + fmtRes(q.res);
  }
  quiz.cur = q;
  quiz.n++;
  $('quizNo').textContent = '练习 第 ' + quiz.n + ' 题';
  $('quizQ').textContent = q.ask;
  $('quizUnit').textContent = q.unit;
  $('quizInput').value = '';
  setQuizRes(null);
  setTarget(t);
}
function parseReading(s){
  s = String(s).trim().replace(/[ΩVΩv]/g, '');
  const m = s.match(/^([0-9.]+)\s*(k|K|千)?$/);
  if(!m) return NaN;
  const v = parseFloat(m[1]);
  return isFinite(v) ? (m[2] ? v*1000 : v) : NaN;
}
function submitQuiz(){
  if(!quiz.cur) return;
  const q = quiz.cur, r = RANGES[state.range];
  const res = computeTarget();
  const cType = r.kind === (q.type === 'batt' ? 'V' : 'R');
  const plugged = state.plugged.red && state.plugged.black;
  const cNorm = plugged && !(r.kind === 'R' && !state.ohmZero);
  const cRange = !res.warn && res.f >= 0.15 && res.f <= 0.95;
  const val = parseReading($('quizInput').value);
  const cRead = isFinite(val) && Math.abs(val - q.v) <= q.tol;
  const score = (cType?2:0) + (cNorm?2:0) + (cRange?2:0) + (cRead?4:0);
  const marks = [['挡位', cType], ['规范', cNorm], ['量程', cRange], ['读数', cRead]]
    .map(([n, ok]) => n + (ok ? '✓' : '✗')).join(' ');
  const hints = [];
  if(!cNorm) hints.push(cType && r.kind === 'R' && !state.ohmZero ? '电阻挡要先短接表笔调零' : '先插好红黑表笔');
  if(!cRange) hints.push('换一挡让指针指到刻度中段（15%~95%）');
  if(!cRead) hints.push('正确值约 ' + fmtRes(q.v) + (q.unit === 'V' ? '' : ''));
  setQuizRes({pass: score >= 6, text: marks + ' → ' + score + '/10' + (hints.length ? '（' + hints.join('；') + '）' : ' 做得漂亮')});
  quiz.hist.push(score >= 6);
  const chips = quiz.hist.slice(-8).map(ok => '<i class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + '</i>').join('');
  const nPass = quiz.hist.filter(Boolean).length;
  $('quizHist').innerHTML = '<b>记录 ' + nPass + '/' + quiz.hist.length + '</b>' + chips;
  toast('本题得分 ' + score + '/10');
}
$('quizSubmit').onclick = submitQuiz;
$('quizGo').onclick = newQuestion;
$('quizSkip').onclick = newQuestion;
$('quizInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') submitQuiz(); });
$('btnQuiz').onclick = ()=>{
  const on = document.body.classList.toggle('quiz-on');
  $('btnQuiz').textContent = on ? '退出练习' : '练习模式';
  if(on && !quiz.cur) newQuestion();
};

const clock = new THREE.Clock();
function loop(){
  const dt = Math.min(0.033, clock.getDelta());
  if(camTween){
    camTween.t = Math.min(camTween.dur, camTween.t + dt);
    const k = camTween.t / camTween.dur;
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    const a = camTween.from, b = camTween.to;
    VIEW.theta = a.theta + (b.theta - a.theta)*e;
    VIEW.phi = a.phi + (b.phi - a.phi)*e;
    VIEW.r = a.r + (b.r - a.r)*e;
    VIEW.target.set(a.tx + (b.tx - a.tx)*e, a.ty + (b.ty - a.ty)*e, a.tz + (b.tz - a.tz)*e);
    placeCamera(); syncCam();
    if(k >= 1) camTween = null;
  }
  updateNeedle(dt);
  updateReadout();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// 初始化
setRange(0, true);
drawCard();
syncUI();
resize();
placeCamera();
syncCam();
const _q = new URLSearchParams(location.search);
const _v = _q.get('view');
if(PRESETS[_v]){
  const p = PRESETS[_v];
  VIEW.theta = p.theta * D2R;
  VIEW.phi = (90 - p.elev) * D2R;
  VIEW.r = p.r;
  VIEW.target.set(0, p.ty, p.tz);
  document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('on', b.dataset.p === _v));
}
const _t = _q.get('theta'), _e = _q.get('elev'), _r = _q.get('r');
const _x = _q.get('x'), _y = _q.get('y');
if(_t !== null) VIEW.theta = Math.max(-1, Math.min(1, (+_t) * D2R));
if(_e !== null) VIEW.phi = Math.max(0.55, Math.min(1.62, (90 - (+_e)) * D2R));
if(_r !== null) VIEW.r = Math.max(5, Math.min(26, +_r));
if(_x !== null) VIEW.target.x = Math.max(PAN.x[0], Math.min(PAN.x[1], +_x));
if(_y !== null) VIEW.target.y = Math.max(PAN.y[0], Math.min(PAN.y[1], +_y));
placeCamera(); syncCam();
if(_q.get('quiz') === '1') $('btnQuiz').click();
needleDeg = 55; needleGroup.rotation.z = 55 * D2R;
loop();
</script>
