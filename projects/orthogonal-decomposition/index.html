<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1ee">
  <title>向量的正交分解 · 60 秒动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2927;
      --muted: #65736e;
      --line: #d7dfda;
      --paper: #f8faf8;
      --green: #087f73;
      --blue: #416fd1;
      --coral: #d85845;
      --gold: #a87618;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #edf1ee;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 48px, 1220px);
      margin: 0 auto;
      padding: 24px 0 28px;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
    }

    .duration {
      flex: 0 0 auto;
      padding: 7px 0 7px 16px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #dce4df;
      border-radius: 7px;
      background: var(--paper);
      box-shadow: 0 10px 28px rgb(30 48 39 / 8%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .captions {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      min-height: 66px;
      padding: 17px 2px 11px;
    }

    .caption-mark {
      flex: 0 0 auto;
      width: 3px;
      height: 24px;
      margin-top: 1px;
      background: var(--gold);
    }

    .caption-text {
      margin: 0;
      color: #263330;
      font-size: 17px;
      line-height: 1.55;
    }

    .vector-symbol {
      position: relative;
      display: inline-block;
      margin: 0 0.04em;
      line-height: 1;
    }

    .vector-symbol::before {
      position: absolute;
      top: -0.13em;
      left: 0.06em;
      right: 0.01em;
      height: 0.07em;
      border-radius: 99px;
      background: currentColor;
      content: "";
    }

    .vector-symbol::after {
      position: absolute;
      top: -0.22em;
      right: -0.03em;
      width: 0.25em;
      height: 0.25em;
      border-top: 0.07em solid currentColor;
      border-right: 0.07em solid currentColor;
      content: "";
      transform: rotate(45deg);
      transform-origin: center;
    }

    .playback {
      display: flex;
      align-items: center;
      gap: 22px;
      min-height: 52px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .transport {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .transport button {
      min-height: 36px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }

    .play-button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      background: var(--ink) !important;
      color: white !important;
      font-size: 14px;
      font-weight: 650;
    }

    .play-symbol {
      width: 16px;
      text-align: center;
      font-size: 14px;
    }

    .restart-button {
      width: 36px;
      color: var(--muted);
      font-size: 20px !important;
      line-height: 1;
    }

    .transport button:hover { background: #e1e8e3; }
    .transport .play-button:hover { background: #30413d !important; }
    button:focus-visible, input:focus-visible { outline: 3px solid #227a72; outline-offset: 3px; }

    .seek-control {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 11px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      margin: 0;
      border-radius: 3px;
      appearance: none;
      background: linear-gradient(to right, var(--green) var(--progress, 0%), #cbd5cf var(--progress, 0%));
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 13px;
      height: 13px;
      border: 2px solid white;
      border-radius: 50%;
      appearance: none;
      background: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 2px solid white;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }

    .chapters {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      padding: 3px 0 1px;
      scrollbar-width: thin;
    }

    .chapter {
      position: relative;
      flex: 0 0 auto;
      padding: 12px 0 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #66736e;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .chapter:hover { color: var(--ink); }
    .chapter[aria-current="step"] { border-bottom-color: var(--green); color: var(--ink); font-weight: 700; }

    @media (max-width: 650px) {
      .page { width: calc(100% - 28px); padding: 17px 0 22px; }
      .masthead { align-items: center; margin-bottom: 13px; }
      .eyebrow { margin-bottom: 5px; font-size: 12px; }
      h1 { font-size: 24px; }
      .duration { padding-left: 10px; font-size: 12px; }
      .stage { aspect-ratio: 4 / 3; }
      .captions { min-height: 65px; gap: 10px; padding-top: 14px; }
      .caption-text { font-size: 15px; }
      .playback { display: block; padding: 9px 0; }
      .transport { justify-content: flex-start; margin-bottom: 10px; }
      .seek-control { gap: 9px; }
      .chapters { gap: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow">高中数学 · 向量</p>
        <h1>向量的正交分解</h1>
      </div>
      <div class="duration">动画时长　01:00</div>
    </header>

    <main>
      <section class="stage" aria-label="正交分解动画画面">
        <canvas id="animation" aria-label="向量 a=(4,2) 沿 x 轴和 y 轴分解"></canvas>
      </section>

      <div class="captions">
        <span class="caption-mark" aria-hidden="true"></span>
        <p class="caption-text" id="caption" aria-live="polite"></p>
      </div>

      <section class="playback" aria-label="动画播放控制">
        <div class="transport">
          <button class="play-button" id="play" type="button" aria-label="播放动画" aria-pressed="false">
            <span class="play-symbol" id="playSymbol" aria-hidden="true">▶</span>
            <span id="playLabel">播放</span>
          </button>
          <button class="restart-button" id="restart" type="button" aria-label="从头播放" title="从头播放">↺</button>
        </div>
        <div class="seek-control">
          <span id="elapsed">00:00</span>
          <input id="seek" type="range" min="0" max="60" step="0.1" value="0" aria-label="动画进度">
          <span>01:00</span>
        </div>
      </section>

      <nav class="chapters" id="chapters" aria-label="动画章节">
        <button class="chapter" type="button" data-time="0">提出问题</button>
        <button class="chapter" type="button" data-time="7">选定坐标轴</button>
        <button class="chapter" type="button" data-time="16">取出 x 分量</button>
        <button class="chapter" type="button" data-time="27">补上 y 分量</button>
        <button class="chapter" type="button" data-time="39">验证垂直</button>
        <button class="chapter" type="button" data-time="50">一般形式</button>
        <button class="chapter" type="button" data-time="57">回顾</button>
      </nav>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const DURATION = 60;
      const SCENES = [
        { start: 0, end: 7, title: "一支斜向量", caption: "向量 {{a}}=(4,2)，怎样把它沿 x 轴和 y 轴拆开？" },
        { start: 7, end: 16, title: "选定坐标轴", caption: "沿 x 轴取一个分量，沿 y 轴取一个分量；两条坐标轴互相垂直。" },
        { start: 16, end: 27, title: "取出 x 方向", caption: "从终点向 x 轴作垂线，脚点是 P=(4,0)，得到 {{a}}₁=(4,0)。" },
        { start: 27, end: 39, title: "补上 y 方向", caption: "从 P 向上到终点，得到 {{a}}₂=(0,2)，两段首尾相接还原 {{a}}。" },
        { start: 39, end: 50, title: "验证互相垂直", caption: "{{a}}₁·{{a}}₂=4×0+0×2=0，所以两个分量互相垂直。" },
        { start: 50, end: 57, title: "写成一般形式", caption: "若 {{a}}=(x,y)，那么 {{a}}=x{{i}}+y{{j}}，两个轴向分量分别沿 x 轴、y 轴。" },
        { start: 57, end: 60, title: "正交分解", caption: "记住：{{a}}={{a}}₁+{{a}}₂=(4,0)+(0,2)。" }
      ];

      const COLORS = {
        paper: "#f8faf8",
        ink: "#1c2927",
        muted: "#75827d",
        grid: "#e3e9e5",
        axis: "#899690",
        green: "#087f73",
        blue: "#416fd1",
        coral: "#d85845",
        gold: "#a87618",
        white: "#ffffff"
      };

      const canvas = document.getElementById("animation");
      const ctx = canvas.getContext("2d");
      const playButton = document.getElementById("play");
      const playSymbol = document.getElementById("playSymbol");
      const playLabel = document.getElementById("playLabel");
      const seek = document.getElementById("seek");
      const elapsed = document.getElementById("elapsed");
      const caption = document.getElementById("caption");
      const chapterButtons = [...document.querySelectorAll(".chapter")];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let time = 0;
      let playing = false;
      let startTime = 0;
      let frameId = 0;

      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const ease = value => {
        const t = clamp(value);
        return t * t * (3 - 2 * t);
      };
      const lerp = (a, b, t) => a + (b - a) * t;
      const map = (point, originX, originY, unit) => [originX + point[0] * unit, originY - point[1] * unit];

      function currentScene(seconds) {
        return SCENES.findIndex((scene, index) => seconds >= scene.start && (seconds < scene.end || index === SCENES.length - 1));
      }

      function formatTime(seconds) {
        const whole = Math.floor(clamp(seconds, 0, DURATION));
        const minutes = Math.floor(whole / 60);
        const remainder = whole % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function setPlaybackState(active) {
        playing = active;
        playButton.setAttribute("aria-pressed", String(active));
        if (active) {
          playSymbol.textContent = "Ⅱ";
          playLabel.textContent = "暂停";
          playButton.setAttribute("aria-label", "暂停动画");
        } else {
          playSymbol.textContent = time >= DURATION ? "↻" : "▶";
          playLabel.textContent = time >= DURATION ? "再看一次" : "播放";
          playButton.setAttribute("aria-label", time >= DURATION ? "再看一次" : "播放动画");
        }
      }

      function updateControls() {
        const sceneIndex = currentScene(time);
        seek.value = String(time);
        seek.style.setProperty("--progress", `${(time / DURATION) * 100}%`);
        elapsed.textContent = formatTime(time);
        caption.innerHTML = SCENES[sceneIndex].caption
          .replaceAll("{{a}}", '<span class="vector-symbol" aria-label="向量 a">a</span>')
          .replaceAll("{{i}}", '<span class="vector-symbol" aria-label="单位向量 i">i</span>')
          .replaceAll("{{j}}", '<span class="vector-symbol" aria-label="单位向量 j">j</span>');
        for (const [index, button] of chapterButtons.entries()) {
          if (index === sceneIndex) button.setAttribute("aria-current", "step");
          else button.removeAttribute("aria-current");
        }
      }

      function line(a, b, color, thickness = 1, alpha = 1, dash = []) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.lineCap = "round";
        ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
        ctx.restore();
      }

      function arrow(a, b, color, thickness = 3, alpha = 1, dashed = false) {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length = Math.hypot(dx, dy);
        if (length < 2) return;
        const angle = Math.atan2(dy, dx);
        const head = clamp(thickness * 3.3, 8, 18);
        line(a, b, color, thickness, alpha, dashed ? [7, 6] : []);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(b[0], b[1]);
        ctx.lineTo(b[0] - head * Math.cos(angle - 0.48), b[1] - head * Math.sin(angle - 0.48));
        ctx.lineTo(b[0] - head * Math.cos(angle + 0.48), b[1] - head * Math.sin(angle + 0.48));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function text(content, x, y, size, color, weight = 500, align = "left") {
        ctx.save();
        ctx.font = `${weight} ${size}px "Segoe UI", "Microsoft YaHei", sans-serif`;
        ctx.textBaseline = "middle";
        ctx.fillStyle = color;
        if (![...content].some(character => "aij".includes(character))) {
          ctx.textAlign = align;
          ctx.fillText(content, x, y);
          ctx.restore();
          return;
        }

        const characters = [...content];
        const widths = characters.map(character => ctx.measureText(character).width);
        const totalWidth = widths.reduce((sum, characterWidth) => sum + characterWidth, 0);
        let cursor = align === "center" ? x - totalWidth / 2 : align === "right" ? x - totalWidth : x;
        ctx.textAlign = "left";
        characters.forEach((character, index) => {
          ctx.fillText(character, cursor, y);
          if ("aij".includes(character)) drawVectorArrow(cursor, y, widths[index], size, color);
          cursor += widths[index];
        });
        ctx.restore();
      }

      function drawVectorArrow(x, y, letterWidth, size, color) {
        const start = x + letterWidth * 0.08;
        const end = x + letterWidth * 0.9;
        const arrowY = y - size * 0.56;
        const head = Math.max(2, size * 0.12);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = Math.max(1, size * 0.055);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(start, arrowY);
        ctx.lineTo(end, arrowY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(end, arrowY);
        ctx.lineTo(end - head, arrowY - head * 0.8);
        ctx.lineTo(end - head, arrowY + head * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function point(position, color, radius = 4, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(position[0], position[1], radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRightAngle(foot, unit, alpha) {
        const size = Math.max(9, unit * 0.24);
        const corner = [foot[0] - size, foot[1]];
        const far = [foot[0] - size, foot[1] - size];
        const end = [foot[0], foot[1] - size];
        line(foot, corner, COLORS.gold, 1.7, alpha);
        line(corner, far, COLORS.gold, 1.7, alpha);
        line(far, end, COLORS.gold, 1.7, alpha);
      }

      function drawGrid(originX, originY, unit, rightEdge, alpha) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(8, 35, rightEdge - 8, height - 42);
        ctx.clip();
        for (let x = -3; x <= 5; x++) {
          const p1 = map([x, -3], originX, originY, unit);
          const p2 = map([x, 4], originX, originY, unit);
          line(p1, p2, x === 0 ? COLORS.axis : COLORS.grid, x === 0 ? 1.35 : 1, alpha);
        }
        for (let y = -3; y <= 4; y++) {
          const p1 = map([-3, y], originX, originY, unit);
          const p2 = map([5, y], originX, originY, unit);
          line(p1, p2, y === 0 ? COLORS.axis : COLORS.grid, y === 0 ? 1.35 : 1, alpha);
        }
        ctx.restore();
      }

      function drawPanel(sceneIndex, panelX, unit, alpha = 1) {
        const compact = width < 650;
        const titleSize = clamp(width * 0.025, 15, 28);
        const bodySize = clamp(width * 0.019, 13, 20);
        const formulaSize = clamp(width * 0.021, 14, 24);
        const top = height * 0.21;
        const gap = compact ? 28 : 39;
        const panelWidth = width - panelX - 18;

        ctx.save();
        ctx.globalAlpha = alpha;
        line([panelX - 18, height * 0.13], [panelX - 18, height * 0.87], "#dce4df", 1.2, 0.95);
        text("这一幕", panelX, top - 26, clamp(bodySize * 0.74, 12, 14), COLORS.green, 700);
        text(SCENES[sceneIndex].title, panelX, top, titleSize, COLORS.ink, 700);
        line([panelX, top + 22], [panelX + Math.min(panelWidth, 55), top + 22], COLORS.gold, 2, 0.9);

        if (sceneIndex === 0) {
          text("a = (4, 2)", panelX, top + gap + 3, formulaSize + 2, COLORS.coral, 700);
          text("横向 4 格", panelX, top + gap * 2, bodySize, COLORS.muted);
          text("纵向 2 格", panelX, top + gap * 3 - 7, bodySize, COLORS.muted);
        } else if (sceneIndex === 1) {
          text("x 方向 + y 方向", panelX, top + gap + 3, formulaSize, COLORS.gold, 700);
          text("沿两条坐标轴", panelX, top + gap * 2, bodySize, COLORS.muted);
          text("两轴互相垂直", panelX, top + gap * 3 - 7, bodySize, COLORS.muted);
        } else if (sceneIndex === 2) {
          text("a₁ = (4, 0)", panelX, top + gap + 3, formulaSize + 1, COLORS.green, 700);
          text("x 方向分量", panelX, top + gap * 2, bodySize, COLORS.muted);
          text("脚点 P=(4,0)", panelX, top + gap * 3 - 7, bodySize, COLORS.muted);
        } else if (sceneIndex === 3) {
          text("a = a₁ + a₂", panelX, top + gap + 3, formulaSize, COLORS.ink, 700);
          text("a₂ = (0, 2)", panelX, top + gap * 2 + 3, formulaSize, COLORS.blue, 700);
          text("从 P 接回终点", panelX, top + gap * 3 - 7, bodySize, COLORS.muted);
        } else if (sceneIndex === 4) {
          text("4×0 + 0×2", panelX, top + gap + 3, formulaSize, COLORS.blue, 700);
          text("= 0", panelX, top + gap * 2 + 6, formulaSize + 8, COLORS.green, 700);
          text("点积为零", panelX, top + gap * 3 + 1, bodySize, COLORS.muted);
        } else if (sceneIndex === 6) {
          text("a = a₁ + a₂", panelX, top + gap + 5, formulaSize, COLORS.ink, 700);
          text("(4,2) = (4,0) + (0,2)", panelX, top + gap * 2 + 5, clamp(width * 0.017, 12, 18), COLORS.green, 650);
          text("x 分量 + y 分量", panelX, top + gap * 3 + 3, bodySize, COLORS.muted);
        }
        ctx.restore();
      }

      function drawFormulaScene(sceneIndex) {
        const boxX = width * 0.07;
        const boxY = height * 0.22;
        const boxW = width * 0.86;
        const boxH = height * 0.58;
        ctx.save();
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = "#d8e1db";
        ctx.lineWidth = 1;
        ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (sceneIndex === 5) {
          const titleSize = clamp(width * 0.023, 16, 27);
          const mathSize = clamp(width * 0.026, 17, 30);
          text("若 a=(x,y)", width / 2, boxY + boxH * 0.27, titleSize, COLORS.gold, 700, "center");
          text("a₁=x i=(x,0)", width / 2, boxY + boxH * 0.52, mathSize, COLORS.green, 700, "center");
          text("a₂=y j=(0,y)", width / 2, boxY + boxH * 0.75, mathSize, COLORS.blue, 700, "center");
        } else {
          const equationSize = clamp(width * 0.032, 19, 36);
          const noteSize = clamp(width * 0.018, 14, 20);
          text("正交分解", width / 2, boxY + boxH * 0.24, clamp(width * 0.024, 17, 28), COLORS.gold, 700, "center");
          text("a = a₁ + a₂", width / 2, boxY + boxH * 0.52, equationSize, COLORS.ink, 700, "center");
          text("x 方向分量       y 方向分量", width / 2, boxY + boxH * 0.76, noteSize, COLORS.muted, 500, "center");
        }
        ctx.restore();
      }

      function draw() {
        if (!width || !height) return;
        ctx.save();
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, width, height);

        const index = currentScene(time);
        const panelX = width * 0.64;
        const originX = width * 0.255;
        const originY = height * 0.735;
        const unit = Math.min(width * 0.067, height * 0.145);
        const origin = map([0, 0], originX, originY, unit);
        const endpoint = map([4, 2], originX, originY, unit);
        const xFoot = map([4, 0], originX, originY, unit);
        const formulaScene = index === 5 || index === 6;
        const gridAlpha = formulaScene ? 0.26 : 1;
        drawGrid(originX, originY, unit, panelX - 8, gridAlpha);

        text("O", origin[0] - 8, origin[1] + 16, clamp(width * 0.015, 12, 17), COLORS.muted, 600, "right");
        text("x", panelX - 23, origin[1] - 10, clamp(width * 0.015, 12, 17), COLORS.muted, 600);
        text("y", origin[0] + 11, height * 0.15, clamp(width * 0.015, 12, 17), COLORS.muted, 600);

        const axisAlpha = index === 1 ? ease((time - 7) / 1.25) : 0;
        if (axisAlpha > 0) {
          const xDirection = map([1.35, 0], originX, originY, unit);
          const yDirection = map([0, 1.35], originX, originY, unit);
          arrow(origin, xDirection, COLORS.gold, 3, axisAlpha);
          arrow(origin, yDirection, COLORS.blue, 3, axisAlpha);
          const xLabel = map([1.5, -0.18], originX, originY, unit);
          const yLabel = map([-0.15, 1.55], originX, originY, unit);
          text("x 方向", xLabel[0], xLabel[1], clamp(width * 0.016, 12, 18), COLORS.gold, 700);
          text("y 方向", yLabel[0], yLabel[1], clamp(width * 0.016, 12, 18), COLORS.blue, 700);
        }

        const vectorReveal = ease(time / 1.6);
        const componentsReveal = ease((time - 15.5) / 1.8);
        const residualReveal = ease((time - 27) / 1.8);
        const verifyReveal = ease((time - 39) / 0.8);
        const quiet = formulaScene ? 0.2 : 1;
        const originalAlpha = lerp(1, 0.26, residualReveal) * quiet;
        const movingEndpoint = [lerp(origin[0], endpoint[0], vectorReveal), lerp(origin[1], endpoint[1], vectorReveal)];
        arrow(origin, movingEndpoint, COLORS.coral, 4, originalAlpha);
        point(origin, COLORS.ink, 4, 0.85);
        point(endpoint, COLORS.coral, 4, vectorReveal * quiet);
        if (vectorReveal > 0.55 && !formulaScene) {
          text("a=(4,2)", endpoint[0] - 8, endpoint[1] - 14, clamp(width * 0.016, 12, 18), COLORS.coral, 700, "right");
        }

        const projectionAlpha = ease((time - 12.2) / 2.7);
        if (projectionAlpha > 0) {
          line(xFoot, endpoint, COLORS.blue, 2, projectionAlpha, [7, 6]);
          point(xFoot, COLORS.green, 4, projectionAlpha);
        }

        if (componentsReveal > 0) {
          arrow(origin, xFoot, COLORS.green, 4.4, componentsReveal * quiet);
          drawRightAngle(xFoot, unit, componentsReveal * quiet);
          if (!formulaScene) {
            const xComponentLabel = map([2.15, -0.42], originX, originY, unit);
            text("a₁=(4,0)", xComponentLabel[0], xComponentLabel[1], clamp(width * 0.015, 12, 17), COLORS.green, 700, "center");
          }
        }

        if (residualReveal > 0) {
          const residualEnd = [lerp(xFoot[0], endpoint[0], residualReveal), lerp(xFoot[1], endpoint[1], residualReveal)];
          arrow(xFoot, residualEnd, COLORS.blue, 4.4, residualReveal * quiet);
          if (residualReveal > 0.45 && !formulaScene) {
            const yComponentLabel = map([4.3, 1.06], originX, originY, unit);
            text("a₂=(0,2)", yComponentLabel[0] + 7, yComponentLabel[1], clamp(width * 0.015, 12, 17), COLORS.blue, 700);
          }
        }

        if (verifyReveal > 0 && index === 4) {
          point(xFoot, COLORS.gold, 7, 0.24 * verifyReveal);
          point(endpoint, COLORS.gold, 7, 0.22 * verifyReveal);
        }

        if (formulaScene) {
          drawFormulaScene(index);
        } else {
          drawPanel(index, panelX, unit);
        }

        const progress = (time / DURATION) * 100;
        ctx.fillStyle = "#d6dfd9";
        ctx.fillRect(0, 0, width, 3);
        ctx.fillStyle = COLORS.green;
        ctx.fillRect(0, 0, width * progress / 100, 3);
        ctx.restore();
      }

      function render() {
        updateControls();
        draw();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        width = rect.width;
        height = rect.height;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        render();
      }

      function seekTo(seconds) {
        time = clamp(Number(seconds) || 0, 0, DURATION);
        if (playing) startTime = performance.now() - time * 1000;
        else setPlaybackState(false);
        render();
      }

      function tick(now) {
        if (!playing) return;
        time = clamp((now - startTime) / 1000, 0, DURATION);
        render();
        if (time >= DURATION) {
          setPlaybackState(false);
          render();
          frameId = 0;
          return;
        }
        frameId = requestAnimationFrame(tick);
      }

      function play() {
        if (time >= DURATION) time = 0;
        setPlaybackState(true);
        startTime = performance.now() - time * 1000;
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(tick);
        render();
      }

      function pause() {
        if (!playing) return;
        setPlaybackState(false);
        cancelAnimationFrame(frameId);
        frameId = 0;
        render();
      }

      playButton.addEventListener("click", () => playing ? pause() : play());
      document.getElementById("restart").addEventListener("click", () => {
        time = 0;
        play();
      });
      seek.addEventListener("input", event => seekTo(event.target.value));
      chapterButtons.forEach(button => {
        button.addEventListener("click", () => seekTo(button.dataset.time));
      });

      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.matches("button, input, textarea, select")) return;
        if (event.code === "Space") {
          event.preventDefault();
          playing ? pause() : play();
        } else if (event.code === "ArrowLeft") {
          seekTo(time - 5);
        } else if (event.code === "ArrowRight") {
          seekTo(time + 5);
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pause();
      });

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(canvas);
      resize();
      if (!reduceMotion) play();
    })();
  </script>
</body>
</html>
